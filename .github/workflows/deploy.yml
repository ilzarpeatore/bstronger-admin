name: Deploy Admin Panel

on:
  push:
    branches: [main]

# Dos merges seguidos lanzaban dos deploys a la vez sobre el mismo directorio
# de la VPS: el `npm ci` de uno borraba node_modules mientras el otro hacía
# `npm run build` ("vite: not found", visto el 2026-09-24). Se encolan en vez
# de solaparse; no se cancela el que está en marcha a medias.
concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/testapp/admin
            git pull origin main
            npm ci
            npm run build
            chown -R www-data:www-data /var/www/testapp/admin
